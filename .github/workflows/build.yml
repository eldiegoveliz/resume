name: Build résumé

on:
  push:
    branches: [master]
    paths:
      - resume.tex
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resume-master
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc latexmk texlive-latex-extra texlive-lang-spanish \
            texlive-fonts-recommended poppler-utils

      - name: Build Markdown and PDFs
        run: ./scripts/build.sh

      - name: Commit generated files
        run: |
          git add -- resume.md resume.pdf 'Diego Véliz.pdf' diego-veliz.pdf
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Rebuild résumé outputs'
          git push origin HEAD:master
